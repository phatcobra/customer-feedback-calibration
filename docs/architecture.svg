<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="560" fill="#fafafa" rx="8"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Customer Feedback Calibration Analyzer</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#666">V3 architecture — decision authority: statistical policy only</text>

  <!-- input -->
  <rect x="300" y="80" width="160" height="44" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="380" y="107" text-anchor="middle" font-size="14" font-weight="600">Customer Review</text>

  <!-- split -->
  <line x1="340" y1="124" x2="220" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="124" x2="540" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- left: historical scores -->
  <rect x="120" y="160" width="200" height="44" rx="8" fill="#e8f4fd" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="220" y="187" text-anchor="middle" font-size="13" font-weight="600">Historical Scores</text>
  <rect x="120" y="220" width="200" height="52" rx="8" fill="#e8f4fd" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="220" y="241" text-anchor="middle" font-size="12">point-in-time filter</text>
  <text x="220" y="259" text-anchor="middle" font-size="12" fill="#555">(timestamp &lt; T only)</text>
  <line x1="220" y1="204" x2="220" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="288" width="200" height="52" rx="8" fill="#e8f4fd" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="220" y="309" text-anchor="middle" font-size="12">deterministic statistics</text>
  <text x="220" y="327" text-anchor="middle" font-size="12" fill="#555">mean · stddev · percentile · z</text>
  <line x1="220" y1="272" x2="220" y2="288" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="356" width="200" height="44" rx="8" fill="#e8f4fd" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="220" y="383" text-anchor="middle" font-size="13" font-weight="600">anomaly policy</text>
  <text x="220" y="396" text-anchor="middle" font-size="11" fill="#555">|z| ≥ 2.0 (project threshold)</text>
  <line x1="220" y1="340" x2="220" y2="356" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- right: text -->
  <rect x="440" y="160" width="200" height="44" rx="8" fill="#fef6e8" stroke="#b57a1a" stroke-width="1.5"/>
  <text x="540" y="187" text-anchor="middle" font-size="13" font-weight="600">Text</text>
  <rect x="440" y="220" width="200" height="52" rx="8" fill="#fef6e8" stroke="#b57a1a" stroke-width="1.5"/>
  <text x="540" y="241" text-anchor="middle" font-size="12">Amazon Comprehend</text>
  <text x="540" y="259" text-anchor="middle" font-size="12" fill="#555">4 confidence scores kept</text>
  <line x1="540" y1="204" x2="540" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="440" y="288" width="200" height="52" rx="8" fill="#fef6e8" stroke="#b57a1a" stroke-width="1.5"/>
  <text x="540" y="309" text-anchor="middle" font-size="12">contextual evidence</text>
  <text x="540" y="327" text-anchor="middle" font-size="12" fill="#555">graceful degradation</text>
  <line x1="540" y1="272" x2="540" y2="288" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- merge -->
  <line x1="220" y1="400" x2="340" y2="440" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="340" x2="420" y2="440" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="440" width="160" height="44" rx="8" fill="#e9f7ef" stroke="#1e7d32" stroke-width="1.5"/>
  <text x="380" y="467" text-anchor="middle" font-size="13" font-weight="600">Result / rationale</text>

  <text x="380" y="516" text-anchor="middle" font-size="12" fill="#222">Comprehend authority: <tspan font-weight="700">contextual evidence only</tspan></text>
  <text x="380" y="536" text-anchor="middle" font-size="12" fill="#222">No error path substitutes a fabricated sentiment.</text>
</svg>
